name: Gmail poll

on:
  # Turn the schedule on after POST /gmail/poll is deployed to Render.
  # GitHub cron runs in UTC and can start a few minutes late.
  # schedule:
  #   - cron: "*/10 * * * *"
  workflow_dispatch: # "Run workflow" button in the Actions tab, for manual tests

# This job only calls our backend, so it needs no access to the repo.
permissions: {}

# Never run two polls at the same time.
concurrency:
  group: gmail-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /gmail/poll
        # Secrets are passed as env vars, not pasted into the command,
        # so they never appear in the script text. GitHub also masks them in logs.
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          GMAIL_POLL_SECRET: ${{ secrets.GMAIL_POLL_SECRET }}
        # --max-time 120 and the retries cover Render's free-tier cold start.
        # Retrying is safe because the backend dedupes by Gmail message id.
        # --fail-with-body makes the run fail (red) on 401/502 and prints the reason.
        run: |
          curl --fail-with-body --silent --show-error \
            --max-time 120 --retry 2 --retry-delay 30 --retry-all-errors \
            -X POST "$BACKEND_URL/gmail/poll" \
            -H "X-Poll-Secret: $GMAIL_POLL_SECRET"
